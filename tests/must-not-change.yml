version: 0.3.0
tests:
- id: N001
  input: كان ثابتًا كالجبل.
  reason: الكاف للتشبيه الحقيقي.
  related_rule: MHR-C002
- id: N002
  input: مر الضوء من خلال النافذة.
  reason: «من خلال» تؤدي معنى حقيقيا.
  related_rule: MHR-C005
- id: N003
  input: أرسلت الإدارة التقرير إلى اللجنة بعد مراجعته.
  reason: مرجع الضمير واضح ولا حاجة إلى تكرار الاسم.
  related_rule: MHR-C029
- id: N004
  input: النظام الذي اعتمده المجلس سيبدأ تشغيله في أكتوبر.
  reason: الجملة الموصولة طبيعية وغير مثقلة.
  related_rule: MHR-C028
- id: N005
  input: لا يلزم تقديم المستند.
  reason: تعني أن التقديم غير واجب، ولا يجوز تحويلها إلى أمر أو منع.
  related_rule: MHR-C031
- id: N006
  input: اعتمد المجلس القرار.
  reason: لا يجوز خفض درجة اليقين.
  related_rule: MHR-C026
- id: N007
  input: قد يؤدي الحل إلى خفض التكلفة.
  reason: لا يجوز تحويل الاحتمال إلى حقيقة.
  related_rule: MHR-C026
- id: N008
  input: يستخدم الفريق Microsoft Teams للاجتماعات.
  reason: اسم منتج رسمي ولا يترجم.
  related_rule: MHR-C016
- id: N009
  input: أرسل المطور طلبا إلى REST API.
  reason: الإنجليزية التقنية ليست عيبا في ذاتها.
  related_rule: MHR-C019
- id: N010
  input: السِّياسة الوطنية للُّغة العربية
  reason: لا يحذف التشكيل المقصود تلقائيا.
  related_rule: MHR-C022
- id: N011
  input: بدأ المشروع في الربع الثالث.
  reason: لا يستنتج شهر البدء.
  related_rule: MHR-C025
- id: N012
  input: ارتفع عدد المستخدمين 20%، وانخفض زمن المعالجة 15%.
  reason: لا ينشئ علاقة سببية.
  related_rule: MHR-C027
- id: N013
  input: لا رسوم ولا انتظار
  context: إعلان تسويقي موجّه للجمهور
  reason: الأسلوب الشعاري مقصود في النص التسويقي، والقاعدة خاصة بالنص النظامي.
  related_rule: MHR-C036
- id: N014
  input: زار الوفد معارض الكتاب
  reason: السياق يحسم أن «معارض» جمع معرض، فلا لبس.
  related_rule: MHR-C037
- id: N015
  input: مثال تطبيقي
  context: عنوان قسم وصفي
  reason: العناوين الوصفية للأقسام تبقى قصيرة، ولا تحمل فكرة تحتاج إلى قولها كاملة.
  related_rule: MHR-C038
- id: N016
  input: لا يكفي الحجم وحده لتقدير الجودة
  reason: «لا» تنفي الفعل، و«وحده» تؤدي معنى مقصودًا، وليست نقلًا لعبارة not just.
  related_rule: MHR-C039
- id: N017
  input: لا توجد دراسة تقيس ذلك
  reason: «لا» هنا لنفي الوجود، وهو موضعها الصحيح.
  related_rule: MHR-C040
- id: N018
  input: النتائج المعلنة في التقرير السنوي
  reason: اسم المفعول هنا تركيب مستقر وواضح، وتحويله إلى فعل لا يضيف وضوحًا.
  related_rule: MHR-C041
- id: N019
  input: أي أداة تختار؟
  reason: «أي» استفهامية مقصودة.
  related_rule: MHR-C042
- id: N020
  input: نوزع المهام حسب الأولوية، ونرتبها حسب الموعد.
  context: نص يستخدم «حسب» باتساق
  reason: الصيغة صحيحة ومتسقة في النص، فلا تُستبدل بـ«بحسب».
  related_rule: MHR-C045
- id: N021
  input: كسر الزجاج
  reason: «كسر» بمعناها الحقيقي، وليست نقلًا لكلمة breaking.
  related_rule: MHR-C046
