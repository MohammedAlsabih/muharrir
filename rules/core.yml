version: 0.3.0
default_mode: review
rule_count: 46
rules:
- id: MHR-C001
  title: ابن الجملة بالعربية لا على قالب اللغة الأصلية
  judgement: review
  scope: general
  status: approved
  description: إذا ظهر أثر ترتيب أو تركيب أجنبي، افهم المعنى ثم أعد بناء الجملة بالعربية. لا تعتبر كل تشابه مع الإنجليزية
    خطأ.
  examples:
    review:
    - هذا يعمل من أجل تحسين التجربة
    preferred:
    - هذا يحسن التجربة
    must_not_change:
    - أخذ الموظف الملف بيده
  sources:
  - GASTAT-editorial
- id: MHR-C002
  title: لا تستخدم الكاف تلقائيا مقابل as الدالة على الوظيفة
  judgement: prefer
  scope: translation
  status: approved
  description: إذا دلت الكاف على وظيفة أو صفة منقولة من as، فضل الحال أو الفعل المباشر أو صياغة عربية طبيعية.
  examples:
    review:
    - يعمل خالد كمدير للمشروع
    - تستخدم الصفحة كواجهة لإدارة الطلبات
    preferred:
    - يعمل خالد مديرًا للمشروع
    - تستخدم الصفحة لإدارة الطلبات
    must_not_change:
    - كان ثابتًا كالجبل
  sources:
  - KSAA-prepositions
- id: MHR-C003
  title: تجنب «من قبل» إذا أمكن إسناد الفعل مباشرة إلى فاعله
  judgement: prefer
  scope: translation
  status: approved
  description: في البناء المتأثر بالمبني للمجهول الإنجليزي، أسند الفعل إلى الفاعل المعروف إذا لم يتغير المعنى.
  examples:
    review:
    - تمت مراجعة الطلب من قبل الفريق
    preferred:
    - راجع الفريق الطلب
    must_not_change:
    - جرى اعتماد القرار أمس
  sources:
  - GASTAT-editorial
- id: MHR-C004
  title: راجع الإفراط في «بشكل» و«بصورة»
  judgement: prefer
  scope: style
  status: approved
  description: اقترح ظرفا أو صفة أبسط عندما يكون المعنى نفسه، ولا تطبق القاعدة على «على شكل» بمعنى الهيئة.
  examples:
    review:
    - يعمل النظام بشكل مستمر
    - ظهرت النتيجة بصورة واضحة
    preferred:
    - يعمل النظام باستمرار
    - ظهرت النتيجة بوضوح
    must_not_change:
    - ظهر الشعار على شكل دائرة
  sources:
  - GASTAT-editorial
- id: MHR-C005
  title: راجع التراكيب الوسيطة الثقيلة
  judgement: review
  scope: style
  status: approved
  description: راجع «تم + مصدر»، و«قام بـ + مصدر»، و«من خلال» عندما يكون الفعل المباشر أو التركيب الأقصر أوضح. لا تمنعها مطلقا.
  examples:
    review:
    - قام الفريق بإعداد التقرير
    - تم البدء في التنفيذ
    - رفع الكفاءة من خلال استخدام التقنية
    preferred:
    - أعد الفريق التقرير
    - بدأ التنفيذ
    - رفع الكفاءة باستخدام التقنية
    must_not_change:
    - تم العثور على المستند
    - مر الضوء من خلال النافذة
  sources:
  - internal-style
- id: MHR-C006
  title: راجع تراكم المصادر والأسماء المعطوفة
  judgement: review
  scope: style
  status: approved
  description: إذا تراكمت المصادر أو الأسماء بحيث يصعب تتبع العلاقة، أعد توزيعها على أفعال أو مكونات أوضح.
  examples:
    review:
    - تطوير وتحسين ورفع كفاءة وتنظيم ومتابعة الخدمات
    preferred:
    - تطوير الخدمات وتحسينها ورفع كفاءة إدارتها ومتابعتها
    must_not_change:
    - الحقوق والواجبات
    - التخطيط والتنفيذ
  sources:
  - GASTAT-editorial
- id: MHR-C007
  title: افصل عناصر التعداد المتعدد بالفواصل
  judgement: prefer
  scope: punctuation
  status: approved
  description: في التعداد المتعدد، استخدم الفاصلة بين العناصر مع واو العطف حيث يلزم، ولا تفصل التراكيب الثنائية المستقرة.
  examples:
    review:
    - التخطيط والتطوير والتنفيذ والمتابعة والقياس والتحسين
    preferred:
    - التخطيط، والتطوير، والتنفيذ، والمتابعة، والقياس، والتحسين.
    must_not_change:
    - الحقوق والواجبات
  sources:
  - GASTAT-editorial
- id: MHR-C008
  title: احذف المقدمة إذا لم تضف معنى
  judgement: prefer
  scope: style
  status: approved
  description: راجع المقدمات من نوع «تجدر الإشارة» و«في هذا الصدد» و«في إطار»؛ احذفها إذا بقي المعنى كاملا.
  examples:
    review:
    - تجدر الإشارة إلى أن المشروع اكتمل في أغسطس
    preferred:
    - اكتمل المشروع في أغسطس.
    must_not_change:
    - في إطار الاتفاقية الموقعة بين الطرفين، تلتزم الشركة...
  sources:
  - GASTAT-editorial
- id: MHR-C009
  title: عنوان الشريحة الاستشارية خلاصة تنفيذية
  judgement: style
  scope: consulting
  status: approved
  description: في الشريحة التحليلية أو التنفيذية، اكتب عنوانا يلخص الرسالة الرئيسة للشريحة، ولو كان طويلا. يستثنى الغلاف والفهرس
    وفواصل الأقسام.
  examples:
    review:
    - أبرز التحديات
    preferred:
    - تتركز التحديات الرئيسة في تداخل المسؤوليات، وتعدد قنوات الخدمة، وضعف تكامل البيانات بين الأنظمة.
    must_not_change:
    - التوصيات
  sources:
  - internal-consulting
- id: MHR-C010
  title: استخدم التعليمات المباشرة في الواجهات
  judgement: style
  scope: digital
  status: approved
  description: في التعليمات الرقمية استخدم الأمر المباشر. لا تستخدم «يرجى» في النص المنشأ؛ استخدم «نأمل» إذا احتاج السياق
    إلى طلب مهذب.
  examples:
    review:
    - يرجى إدخال رقم الهوية
    - يرجى موافاتنا بالوثائق المطلوبة
    preferred:
    - أدخل رقم الهوية
    - نأمل موافاتنا بالوثائق المطلوبة
    must_not_change:
    - نأمل مراجعة الاتفاقية وإفادتنا بمرئياتكم
  sources:
  - internal-style
  - DGA-digital
- id: MHR-C011
  title: رسالة الخطأ تشرح المشكلة والإجراء المأمون
  judgement: prefer
  scope: digital
  status: approved
  description: وضح المشكلة وما يستطيع المستخدم فعله إذا كانت المعلومة معروفة. لا تخترع سببا أو حدا أو شرطا غير موجود.
  examples:
    review:
    - إدخال غير صالح
    preferred:
    - أدخل رقم هوية مكونا من 10 أرقام.
    must_not_change:
    - تعذر إرسال الطلب
  sources:
  - DGA-digital
- id: MHR-C012
  title: الحالة الفارغة تصف ما هو فارغ تحديدا
  judgement: style
  scope: digital
  status: approved
  description: استخدم جملة عربية مكتملة عندما تكون أوضح من الاختزال، ولا تخترع إجراء تاليا غير موجود.
  examples:
    review:
    - لا طلبات متاحة
    - لا نتائج متاحة
    preferred:
    - لا توجد طلبات حاليا.
    - لا توجد نتائج تطابق بحثك.
    must_not_change:
    - لا توجد نتائج.
  sources:
  - internal-style
- id: MHR-C013
  title: اسم الزر يصف نتيجة الفعل قدر الإمكان
  judgement: style
  scope: digital
  status: approved
  description: فضل «إرسال الطلب» و«حفظ التغييرات» على الأزرار المبهمة عند الحاجة، مع إبقاء «التالي» و«السابق» و«إلغاء» عندما
    تكون واضحة.
  examples:
    review:
    - نعم
    preferred:
    - حذف الطلب
    must_not_change:
    - التالي
    - إلغاء
  sources:
  - DGA-digital
  - internal-style
- id: MHR-C014
  title: ميز بين حالة النظام وقدرة المستخدم وصلاحيته
  judgement: guardrail
  scope: digital
  status: approved
  description: لا تعامل «لا يوجد»، و«لا يمكنك»، و«ليس لديك صلاحية»، و«لا يمكن بعد الاعتماد» كمترادفات.
  examples:
    review:
    - لا توجد إجراءات متاحة.
    preferred:
    - لا توجد إجراءات متاحة.
    must_not_change:
    - ليس لديك صلاحية لتنفيذ هذا الإجراء.
  sources:
  - internal-style
- id: MHR-C015
  title: استخدم العربية عند وجود مصطلح عربي مستقر
  judgement: prefer
  scope: terminology
  status: approved
  description: استخدم المقابل العربي المستقر في السياق المهني، ولا تترجم المصطلحات أو الأسماء بغير تحقق.
  examples:
    review:
    - إدارة الـ Stakeholders
    - مراجعة الـ Requirements
    preferred:
    - إدارة أصحاب المصلحة
    - مراجعة المتطلبات
    must_not_change:
    - تشغيل Power BI
  sources:
  - KSAA-policy
- id: MHR-C016
  title: لا تترجم الأسماء الرسمية من عندك
  judgement: guardrail
  scope: terminology
  status: approved
  description: حافظ على أسماء الجهات والمنتجات والشهادات والأطر والعلامات، واستخدم الاسم العربي الرسمي فقط إذا كان موثقا.
  examples:
    review:
    - Microsoft Teams
    preferred:
    - Microsoft Teams
    must_not_change:
    - Baldrige Excellence Framework
  sources:
  - internal-accuracy
- id: MHR-C017
  title: مفهوم واحد = مصطلح واحد
  judgement: prefer
  scope: terminology
  status: approved
  description: لا تنوع المصطلحات لمجرد تجنب التكرار. وحد المصطلح إذا كان يشير إلى المفهوم نفسه.
  examples:
    review:
    - المستفيد... المستخدم... العميل
    preferred:
    - المستفيد... المستفيد... المستفيد
    must_not_change:
    - المستخدم يدير حسابه، والمستفيد يتلقى الخدمة.
  sources:
  - KSAA-policy
  - internal-style
- id: MHR-C018
  title: عرّف الاختصار بحسب الجمهور
  judgement: review
  scope: terminology
  status: approved
  description: عرّف الاختصار في أول ظهور إذا كان الجمهور قد لا يعرفه، ولا تثقل النص التقني بشرح الاختصارات المعروفة كل مرة.
  examples:
    review:
    - يجب تحقيق SLA بنسبة 99.9%
    preferred:
    - يجب تحقيق مستوى الخدمة المحدد في اتفاقية مستوى الخدمة (SLA) بنسبة 99.9%.
    must_not_change:
    - REST API
    - JSON
  sources:
  - internal-style
- id: MHR-C019
  title: راجع الهجين العربي الإنجليزي غير الضروري
  judgement: review
  scope: terminology
  status: approved
  description: إذا كان المزج نتيجة عادة لا حاجة تقنية، اقترح العربية الطبيعية. لا تعد أسماء المنتجات والمصطلحات التقنية عيبا
    في ذاتها.
  examples:
    review:
    - نراجع الـ Requirements قبل الـ Meeting
    preferred:
    - نراجع المتطلبات قبل الاجتماع.
    must_not_change:
    - أرسل طلبا إلى REST API.
  sources:
  - KSAA-policy
  - internal-style
- id: MHR-C020
  title: استخدم ترقيمًا مهنيًا متسقًا
  judgement: prefer
  scope: punctuation
  status: approved
  description: لا تترك مسافة قبل علامة الترقيم، ولا تكدس علامات الاستفهام والتعجب. حافظ على علامات النصوص التقنية والروابط.
  examples:
    review:
    - اكتمل المشروع ، وبدأ التشغيل .
    - هل تم الإرسال؟؟؟
    preferred:
    - اكتمل المشروع، وبدأ التشغيل.
    - هل تم الإرسال؟
    must_not_change:
    - https://example.com
    - '10.5'
  sources:
  - GASTAT-editorial
- id: MHR-C021
  title: لا تبق بنية السؤال داخل الجملة الخبرية دون حاجة
  judgement: prefer
  scope: style
  status: approved
  description: إذا لم تكن الجملة سؤالا موجها، أعد بناء الاستفهام المضمن إلى تركيب خبري طبيعي عندما يكون ذلك أوضح.
  examples:
    review:
    - نحتاج إلى معرفة متى يبدأ المشروع.
    - لا أعلم هل اعتمدت اللجنة التقرير.
    preferred:
    - نحتاج إلى معرفة وقت بدء المشروع.
    - لا أعلم شيئا عن اعتماد اللجنة للتقرير.
    must_not_change:
    - متى يبدأ المشروع؟
  sources:
  - internal-style
- id: MHR-C022
  title: التشكيل ليس ممنوعا ولا مطلوبا تلقائيا
  judgement: style
  scope: general
  status: approved
  description: لا تضف تشكيلًا كاملا تلقائيا في النص المهني، واستخدم التشكيل الجزئي لدفع اللبس، ولا تحذف تشكيل الكاتب بلا سبب.
  examples:
    review:
    - تهدف المُبادرة إلى تَطوير الخِدمات
    preferred:
    - تهدف المبادرة إلى تطوير الخدمات.
    must_not_change:
    - السِّياسة الوطنية
  sources:
  - internal-style
- id: MHR-C023
  title: حافظ على نمط الأرقام في الوثيقة
  judgement: guardrail
  scope: general
  status: approved
  description: لا تغير نمط الأرقام آليا. إذا اختلط 123 و١٢٣، نبه إلى عدم الاتساق وحدد النمط بحسب سياسة الوثيقة إن كانت معروفة.
  examples:
    review:
    - شملت الدراسة 25 جهة و١٢٠ مستفيدا
    preferred:
    - نمط الأرقام غير متسق؛ وحّده بحسب سياسة الوثيقة.
    must_not_change:
    - القرار رقم ١٢٣
  sources:
  - GASTAT-numbers
- id: MHR-C024
  title: عالج تعقيد الجملة لا طولها المجرد
  judgement: review
  scope: style
  status: approved
  description: لا تضع حدا آليا لعدد الكلمات. قسم أو أعد بناء الجملة إذا تشابكت العلاقات وصعب تتبعها.
  examples:
    review:
    - المنصة التي طورتها الجهة والتي تهدف إلى توحيد الخدمات والتي ترتبط بعدد من الأنظمة...
    preferred:
    - طورت الجهة المنصة لتوحيد الخدمات، وربطتها بعدد من الأنظمة.
    must_not_change:
    - أظهرت الدراسة أن توحيد الإجراءات وخفض عدد الموافقات ساهما في تقليص الزمن بنسبة 30%.
  sources:
  - GASTAT-editorial
- id: MHR-C025
  title: لا تغير الحقائق والأرقام
  judgement: guardrail
  scope: general
  status: approved
  description: يحظر تقريب أو تبديل رقم أو تاريخ أو نسبة أو نطاق أو اسم جهة أثناء التحرير.
  examples:
    review:
    - شملت الدراسة 27 جهة، وانخفض الزمن 18%.
    preferred:
    - شملت الدراسة 27 جهة، وانخفض الزمن 18%.
    must_not_change:
    - بدأ المشروع في الربع الثالث.
  sources:
  - GASTAT-editorial
- id: MHR-C026
  title: حافظ على درجة اليقين
  judgement: guardrail
  scope: general
  status: approved
  description: لا تحول «قد» و«يشير» و«متوقع» و«يقدر» إلى حقيقة قطعية، ولا تضعف حقيقة قطعية بلا سبب.
  examples:
    review:
    - قد يؤدي الحل إلى خفض التكلفة.
    preferred:
    - قد يؤدي الحل إلى خفض التكلفة.
    must_not_change:
    - اعتمد المجلس القرار.
  sources:
  - GASTAT-editorial
- id: MHR-C027
  title: لا تخترع علاقة سببية
  judgement: guardrail
  scope: general
  status: approved
  description: لا تحول اقتران حدثين إلى سببية، ولا تضف «بسبب» أو «أدى إلى» إذا لم يذكر الأصل العلاقة.
  examples:
    review:
    - ارتفع عدد المستخدمين 20%، وانخفض زمن المعالجة 15%.
    preferred:
    - ارتفع عدد المستخدمين 20%، وانخفض زمن المعالجة 15%.
    must_not_change: []
  sources:
  - internal-accuracy
- id: MHR-C028
  title: راجع سلاسل الأسماء الموصولة
  judgement: review
  scope: style
  status: approved
  description: راجع توالي «الذي/التي» إذا أثقل الجملة، ولا تغير جملة موصولة طبيعية وواضحة.
  examples:
    review:
    - المنصة التي طورتها الجهة والتي تهدف إلى توحيد الخدمات والتي ترتبط بعدد من الأنظمة
    preferred:
    - طورت الجهة المنصة لتوحيد الخدمات، وربطتها بعدد من الأنظمة.
    must_not_change:
    - النظام الذي اعتمده المجلس سيبدأ تشغيله في أكتوبر.
  sources:
  - internal-style
- id: MHR-C029
  title: لا تفك الضمير إلا عند لبس حقيقي
  judgement: guardrail
  scope: style
  status: approved
  description: حافظ على الضمير إذا كان مرجعه واضحا. إذا احتمل أكثر من مرجع، نبه ولا تخمن.
  examples:
    review:
    - أخبرت سارة نورة أن طلبها اعتمد.
    preferred:
    - راجع مرجع الضمير «ها»؛ يحتمل سارة أو نورة.
    must_not_change:
    - أرسلت الإدارة التقرير إلى اللجنة بعد مراجعته.
  sources:
  - internal-style
- id: MHR-C030
  title: راجع تكرار الفكرة لا تكرار الكلمة
  judgement: review
  scope: style
  status: approved
  description: احذف التكرار الدلالي الذي لا يضيف معنى، ولا تستبدل الكلمات المتكررة بمترادفات لمجرد التنويع.
  examples:
    review:
    - رفع كفاءة العمليات وتحسين أدائها، بما يسهم في زيادة كفاءة العمل وتحسين مستوى الأداء
    preferred:
    - رفع كفاءة العمليات وتحسين أدائها.
    must_not_change:
    - انخفضت التكلفة، لكن انخفاضها لم ينعكس على السعر.
  sources:
  - GASTAT-editorial
- id: MHR-C031
  title: فك النفي المركب إذا كان البديل أوضح ولا يغير المعنى
  judgement: review
  scope: style
  status: approved
  description: اقترح الإثبات المباشر عندما يحافظ على المعنى، ولا تحول «غير واجب» إلى «ممنوع».
  examples:
    review:
    - لا يمكن عدم إرفاق المستند.
    preferred:
    - يجب إرفاق المستند.
    must_not_change:
    - لا يلزم تقديم المستند.
  sources:
  - internal-style
- id: MHR-C032
  title: قدم المعلومة الأساسية قبل ملابساتها
  judgement: prefer
  scope: style
  status: approved
  description: قدم الحدث أو القرار أو النتيجة أولا إذا لم تكن المقدمة ضرورية قانونيا أو لفهم السياق.
  examples:
    review:
    - في ضوء نتائج الدراسة وملاحظات الإدارات، فقد قررت اللجنة اعتماد النموذج.
    preferred:
    - قررت اللجنة اعتماد النموذج، بناء على نتائج الدراسة وملاحظات الإدارات.
    must_not_change:
    - 'بناء على قرار مجلس الإدارة رقم 15، تعتمد الشركة السياسة الآتية:'
  sources:
  - GASTAT-editorial
- id: MHR-C033
  title: استخدم علامات الاقتباس والمعلومات الاعتراضية بأمان
  judgement: guardrail
  scope: punctuation
  status: approved
  description: لا تنشئ اقتباسا مباشرا من إعادة صياغة، ولا تدع وجود حذف بالنقاط دون تحقق. استخدم الأقواس للمعلومة التفسيرية
    دون تكديس.
  examples:
    review:
    - أوضح المدير أن التشغيل سيبدأ في أكتوبر.
    preferred:
    - أوضح المدير أن التشغيل سيبدأ في أكتوبر.
    must_not_change:
    - 'قال المدير: «سنبدأ التنفيذ غدا».'
  sources:
  - GASTAT-editorial
- id: MHR-C034
  title: استخدم النقطتين والفاصلة المنقوطة بحسب الوظيفة
  judgement: prefer
  scope: punctuation
  status: approved
  description: استخدم النقطتين قبل التفصيل الواضح أو القول، والفاصلة المنقوطة عند علاقة سببية أو تعليلية بين جملتين مستقلتين
    نسبيا. لا تطبق ميكانيكيا.
  examples:
    review:
    - تتكون المنهجية من ثلاث مراحل، التخطيط، والتنفيذ، والمتابعة.
    preferred:
    - 'تتكون المنهجية من ثلاث مراحل: التخطيط، والتنفيذ، والمتابعة.'
    must_not_change:
    - اجتمع الفريق صباحا، وناقش خطة التنفيذ.
  sources:
  - GASTAT-editorial
- id: MHR-C035
  title: لا تفرض وجها واحدا إذا تعددت الأوجه الصحيحة
  judgement: guardrail
  scope: general
  status: approved
  description: إذا أثبت المرجع صحة أكثر من وجه، فاحتفظ بدرجة الحكم. «أفصح» أو «أجود» لا تعني أن الوجه الآخر خطأ.
  examples:
    review:
    - شئون
    - يقرؤون
    - أن لا
    preferred:
    - تترك إذا كانت صحيحة في المرجع؛ ويمكن تسجيل وجه مفضل دون تصنيف الآخر خطأ.
    must_not_change:
    - شؤون
    - يقرأون
    - ألا
  sources:
  - KSAA-consultations
  - internal-policy
- id: MHR-C036
  title: الصيغة الشعارية «لا… ولا…» في النص النظامي
  judgement: prefer
  scope: regulatory
  status: approved
  description: في النصوص النظامية والتنظيمية والعروض الاستشارية، استبدل صيغة «لا X ولا Y ولا Z» بصياغة تبيّن الحكم أو
    الشرط. إذا كانت الصيغة «لا… إلا» فيجب أن يحفظ البديل معنى الحصر. يُستثنى النص التسويقي الموجّه للجمهور إذا كان الأسلوب
    مقصودًا.
  examples:
    review:
    - لا بيع ولا إعلان ولا معارض قبل ترخيص المشروع
    - لا صرف من الحساب إلا بوثيقة يوقعها المدير المالي
    preferred:
    - يُشترط ترخيص المشروع قبل البيع أو الإعلان أو العرض في المعارض
    - لا يُصرف من الحساب إلا بوثيقة يوقعها المدير المالي
    - يُشترط لأي صرف من الحساب وثيقة يوقعها المدير المالي
    must_not_change:
    - لا رسوم ولا انتظار
  sources:
  - owner-review-2026-11
- id: MHR-C037
  title: الكلمة الملتبسة عند حذف ما يوضحها
  judgement: review
  scope: general
  status: approved
  description: إذا حُذف من التركيب ما يحدد معنى الكلمة فاحتملت قراءتين، فأعد التركيب بما يدفع اللبس. لا تطبق القاعدة إذا
    كان السياق يحسم المعنى.
  examples:
    review:
    - لا بيع ولا إعلان ولا معارض قبل ترخيص المشروع
    preferred:
    - يُشترط ترخيص المشروع قبل البيع أو الإعلان أو العرض في المعارض
    must_not_change:
    - زار الوفد معارض الكتاب
  sources:
  - owner-review-2026-11
- id: MHR-C038
  title: العنوان الذي يحمل فكرة يقولها كاملة
  judgement: prefer
  scope: headings
  status: approved
  description: العنوان الذي يحمل فكرة، كالمبدأ أو عنوان الدرس أو القسم أو المثال، يقولها كاملة ويُفهم دون قراءة ما تحته.
    اختباره أن يستطيع القارئ أن يقول ما يدّعيه العنوان بعد قراءته وحده. العناوين الوصفية للأقسام تبقى قصيرة.
  examples:
    review:
    - الجودة خاصية المنظومة
    - نتيجة الأداء مرهونة بظروف قياسها
    - ترتيب ينقلب
    - من 90% إلى 59%
    - اختر الأساس
    preferred:
    - الجودة ناتج المنظومة كاملة وليست محدودة بالنموذج
    - نتائج الأداء التي حققها غيرك قد لا تتكرر في منتجك
    - ترتيب النماذج ينقلب بتغيير الهارنس
    - نجاح 90% في المحاولة الواحدة يصبح 59% في أسبوع
    - تكتب الحلقة بنفسك أم تستخدم إطارًا؟
    must_not_change:
    - مثال تطبيقي
    - ما تنتبه إليه
  sources:
  - owner-review-2026-11
- id: MHR-C039
  title: «لا X وحده» ترجمة لـ not just
  judgement: prefer
  scope: translation
  status: approved
  description: صيغة «X، لا Y وحده» نقل حرفي لعبارة not just Y. قل ما تقصده، مثل «وليست محدودة بـY» أو «وY جزء منها».
    لا تطبق القاعدة إذا كانت «وحده» تؤدي معنى مقصودًا بعد نفي فعل.
  examples:
    review:
    - الجودة ناتج النظام كله، لا النموذج وحده
    preferred:
    - الجودة ناتج المنظومة كاملة وليست محدودة بالنموذج
    must_not_change:
    - لا يكفي الحجم وحده لتقدير الجودة
  sources:
  - owner-review-2026-11
- id: MHR-C040
  title: «وليس» للمقابلة و«لا» لنفي الفعل والوجود
  judgement: style
  scope: general
  status: approved
  description: للمقابلة بين أمرين استخدم «وليس»، واحتفظ بـ«لا» لنفي الفعل أو الوجود. خبر «ليس» منصوب ويظهر النصب في النكرة،
    وتطابق «ليس» ما تعود عليه. العطف بـ«لا» صحيح في العربية، فلا يوصف بأنه خطأ.
  examples:
    review:
    - هذه نقاط بداية، وليس قواعد.
    - قرار منتج لا قرار تقني
    preferred:
    - هذه نقاط بداية، وليست قواعد.
    - قرار منتج وليس قرارًا تقنيًا
    must_not_change:
    - لا توجد دراسة تقيس ذلك
  sources:
  - owner-review-2026-11
  - internal-style
- id: MHR-C041
  title: الفعل أوضح من اسم المفعول وسلاسل الإضافة
  judgement: prefer
  scope: general
  status: approved
  description: إذا أمكن قول المعنى بفعل وفاعل فهو غالبًا أوضح من اسم مفعول أو سلسلة إضافات. اختر الفعل الذي يطابق ما حدث،
    فالنتيجة التي تحققت عند غيرك «قد لا تتكرر» عندك، والرقم الذي يعلنه غيرك «قد لا يتحقق» عندك. لا تطبق القاعدة على
    تركيب مستقر وواضح.
  examples:
    review:
    - نتائج الأداء المحققة لدى الآخرين
    preferred:
    - نتائج الأداء التي حققها غيرك
    must_not_change:
    - النتائج المعلنة في التقرير السنوي
  sources:
  - owner-review-2026-11
- id: MHR-C042
  title: «أي» التفسيرية بعد سؤال تُقرأ استفهامًا
  judgement: review
  scope: general
  status: approved
  description: إذا جاءت «أي» التفسيرية بعد جملة استفهامية، قرأها القارئ استفهامًا جديدًا. استخدم رابطًا لا يلتبس، مثل «وهذا
    يعني أن». إذا قفز النص بين فكرتين فأضف الرابط المناسب، مثل «لذلك» أو «إن كان كذلك».
  examples:
    review:
    - لماذا فشلت هذه المهمة؟ أي الآثار غير كافية.
    preferred:
    - لماذا فشلت هذه المهمة؟ وهذا يعني أن الآثار غير كافية.
    must_not_change:
    - أي أداة تختار؟
  sources:
  - owner-review-2026-11
- id: MHR-C043
  title: مصطلح يتصادم مع مصطلح آخر في النص نفسه
  judgement: review
  scope: terminology
  status: approved
  description: لا تختر مصطلحًا يشترك في لفظه مع مصطلح آخر في النص نفسه بمعنى مختلف. إذا كانت «التعليمات» تعني system
    prompt، فلا تسمِّ prompt caching «التخزين المؤقت للتعليمات».
  examples:
    review:
    - تعليمات النظام … التخزين المؤقت للتعليمات
    preferred:
    - تعليمات النظام … التخزين المؤقت للمدخلات (prompt caching)
    must_not_change: []
  sources:
  - owner-review-2026-11
- id: MHR-C044
  title: عدّل الإحالات عند تغيير عنوان أو اسم
  judgement: guardrail
  scope: terminology
  status: approved
  description: إذا غيّرت عنوانًا أو اسمًا أثناء التحرير، فابحث عن كل موضع يحيل إليه في النص وعدّله، حتى لا تبقى إحالة إلى
    عنوان لم يعد موجودًا.
  examples:
    review:
    - (العنوان أصبح «نتائج الأداء التي حققها غيرك قد لا تتكرر في منتجك») انظر قسم «نتيجة الأداء مرهونة بظروف قياسها».
    preferred:
    - انظر قسم «نتائج الأداء التي حققها غيرك قد لا تتكرر في منتجك».
    must_not_change: []
  sources:
  - owner-review-2026-11
- id: MHR-C045
  title: صيغة واحدة عند تعدد الصيغ الصحيحة
  judgement: style
  scope: terminology
  status: approved
  description: إذا تعددت الصيغ الصحيحة، مثل «بدل» و«بدلًا من»، و«حسب» و«بحسب»، و«كلفة» و«تكلفة»، فاختر صيغة واحدة وطبّقها
    في النص كله. هذا اتساق، وليس تصحيح خطأ. لا تغيّر صيغة صحيحة يستخدمها النص باتساق.
  examples:
    review:
    - نوزع المهام بحسب الأولوية … ونرتبها حسب الموعد
    preferred:
    - نوزع المهام بحسب الأولوية … ونرتبها بحسب الموعد
    must_not_change:
    - نوزع المهام حسب الأولوية … ونرتبها حسب الموعد
  sources:
  - owner-review-2026-11
  - internal-style
- id: MHR-C046
  title: ترجمات حرفية مرصودة (كسر، يتقاعد، تشريح، المجتمع، على الإنتاج، عامل… معاملة)
  judgement: prefer
  scope: translation
  status: approved
  description: كلمات نُقلت حرفيًا من الإنجليزية بمعنى لا تحمله في العربية، مثل breaking وbroke وretire وanatomy وcommunity
    وon production وtreat as وas code. استبدلها بما يقول المعنى المقصود. لا تطبق القاعدة على الكلمة بمعناها الحقيقي.
  examples:
    review:
    - إصدار كاسر للتوافق
    - تغيير كسر ترتيب الطلب
    - حين يتقاعد النموذج
    - تشريح نافذة السياق
    - متداولة في المجتمع
    - التقييم على الإنتاج
    - عامل المخرجات مدخلات غير موثوقة
    - السياسات كشيفرة
    preferred:
    - إصدار غير متوافق مع ما قبله
    - تغيير أفسد ترتيب الطلب
    - حين يتوقف دعم النموذج
    - ما يملأ نافذة السياق
    - متداولة بين الممارسين
    - التقييم في بيئة الإنتاج
    - تعامل مع المخرجات على أنها مدخلات غير موثوقة
    - كتابة السياسات بصيغة شيفرة (policy as code)
    must_not_change:
    - كسر الزجاج
  sources:
  - owner-review-2026-11
